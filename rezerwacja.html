<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarezerwuj Miejsce - Akademia APEX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <main class="container py-5">
        <header class="text-center mb-5">
            <h1 class="neon-text">Rezerwacja Miejsca</h1>
            <p class="lead text-muted">Zabezpiecz cyfrową przyszłość swojego dziecka w Akademii APEX</p>
        </header>

        <section class="form-wrapper max-w-md mx-auto card p-4">
            <!-- Formspree Backend Integration -->
            <form action="https://formspree.io/f/xwlldrnn" method="POST" class="flex flex-col gap-4">
                
                <div class="form-group">
                    <label for="parent_name" class="form-label">Imię i Nazwisko Rodzica / Opiekuna</label>
                    <input type="text" id="parent_name" name="Rodzic" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Adres E-mail do kontaktu</label>
                    <!-- name="email" pisane małymi literami zapewnia poprawne działanie Autorespondera Formspree -->
                    <input type="email" id="email" name="email" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Numer Telefonu</label>
                    <input type="tel" id="phone" name="Telefon" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="child_name" class="form-label">Imię Dziecka</label>
                    <input type="text" id="child_name" name="Dziecko_Imie" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="child_age" class="form-label">Wiek Dziecka</label>
                    <select id="child_age" name="Dziecko_Wiek" required class="form-input">
                        <option value="">Wybierz wiek...</option>
                        <option value="9-10">9 - 10 lat</option>
                        <option value="11-12">11 - 12 lat</option>
                        <option value="13+">13+ lat</option>
                    </select>
                </div>

                <!-- MAKSYMALNIE UPROSZCZONE I STERILNE POLE GITHUB -->
<div class="form-group">
    <label for="github_login" class="form-label">Login GitHub dziecka (Opcjonalnie)</label>
    
    <input type="text" id="github_login" name="GitHub_Login" class="form-input" placeholder="np. PixelMaster9">
    <!--<input type="text" id="github_login" name="GitHub_Login" class="form-input" placeholder="np. PixelMaster9" pattern="^[a-zA-Z0-9](?:[a-zA-Z0-9]|-(?=[a-zA-Z0-9])){0,38}$"> -->
    <small class="text-muted" style="font-size: 0.8rem; display: block; margin-top: 6px; line-height: 1.4;">
        💡 Wpisz istniejący login, swoją propozycję nowej nazwy lub pozostaw pole puste – nasz zespół techniczny zajmie się resztą przed zajęciami.
    </small>
</div>


                <!-- NOWOŚĆ: Elastyczne pole na dowolną treść / Zapytanie Rodzica -->
                <div class="form-group">
                    <label for="parent_message" class="form-label">Dodatkowe uwagi / pytania rodzica (opcjonalnie)</label>
                    <textarea id="parent_message" name="Wiadomość_Dodatkowa" rows="4" placeholder="Wpisz tutaj swoje pytania, informacje o dziecku lub dodatkowe uwagi..." class="form-input" style="width: 100%; resize: vertical; min-height: 100px; font-family: inherit; box-sizing: border-box;"></textarea>
                </div>

                <!-- Zgody Formalne i RODO -->
                <div class="form-checkboxes my-3 flex flex-col gap-2 text-sm">
                    <label class="flex items-start gap-2">
                        <input type="checkbox" name="Zgoda_RODO" required class="mt-1">
                        <span>Wyrażam zgodę na przetwarzanie danych w celu rejestracji do Akademii APEX.</span>
                    </label>
                    <label class="flex items-start gap-2">
                        <input type="checkbox" name="Zgoda_Regulamin" required class="mt-1">
                        <span>Akceptuję warunki rezerwacji wstępnej i regulamin organizacyjny.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-neon w-full py-3">Wyślij Zgłoszenie Rezerwacji</button>
            </form>
        </section>

        <footer class="text-center mt-5">
            <a href="index.html" class="link-back">← Powrót do strony głównej</a>
        </footer>
    </main>

    <!-- ASYNCHRONICZNY SILNIK AJAX (NOWINKA TECHNOLOGICZNA) -->
    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const button = form.querySelector('button');
            const wrapper = document.querySelector('.form-wrapper');
            
            button.disabled = true;
            button.innerText = "Wysyłanie zgłoszenia do chmury APEX...";

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    // Podmiana interfejsu w locie (Efekt WOW dla głównej rezerwacji)
                    wrapper.innerHTML = `
                        <div style="text-align: center; padding: 15px;">
                            <div style="font-size: 3rem; margin-bottom: 15px;">🛰️</div>
                            <h3 style="color: #56D364; margin-bottom: 15px; font-size: 1.3rem; text-shadow: 0 0 10px rgba(86,211,100,0.3);">ZGŁOSZENIE PRZYJĘTE!</h3>
                            <p style="color: #C9D1D9; font-size: 0.95rem; line-height: 1.5; text-align: left; margin-bottom: 15px;">
                                Dziękujemy! Formularz rezerwacji wstępnej został bezpiecznie zarejestrowany w bazie danych systemu APEX.
                            </p>
                            <p style="color: #8B949E; font-size: 0.85rem; line-height: 1.5; text-align: left; background: rgba(255,255,255,0.02); padding: 12px; border-left: 3px solid #56D364; border-radius: 4px;">
                                📬 <strong>System operacyjny:</strong> W ciągu kilku minut wyślemy na Państwa adres e-mail oficjalne potwierdzenie zgłoszenia wraz z dalszymi krokami logistycznymi.
                            </p>
                            <p style="color: #C9D1D9; font-size: 0.9rem; margin-top: 25px; font-weight: bold; line-height: 1.4;">
                                Witamy na pokładzie!<br>
                                <span style="color: #56D364; font-size: 0.85rem; font-weight: normal;">Natalia Gieczonis Czyżyk</span>
                            </p>
                        </div>
                    `;
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                button.disabled = false;
                button.innerText = "Błąd krytyczny sieci. Spróbuj ponownie";
                button.style.borderColor = "#FF6B6B";
                button.style.color = "#FF6B6B";
            }
        });
    </script>

    
</body>
</html>
