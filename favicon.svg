  <path d="M38,22 C41,17 41,12 39,8" fill="none" stroke="#39FF14" stroke-width="4" stroke-linecap="round"/>

  <!-- Lewe ucho -->
  <path d="M22,25 C12,21 6,24 6,31 C11,34 18,33 22,30" fill="none" stroke="#39FF14" stroke-width="4.2" stroke-linejoin="round"/>
  <!-- Prawe ucho -->
  <path d="M42,25 C52,21 58,24 58,31 C53,34 46,33 42,30" fill="none" stroke="#39FF14" stroke-width="4.2" stroke-linejoin="round"/>

  <!-- Czoło i obrys pyszczka sarenki -->
  <path d="M22,25 Q32,20 42,25 L37,52 Q32,58 27,52 Z" fill="none" stroke="#39FF14" stroke-width="4.5" stroke-linejoin="round"/>
</svg>
